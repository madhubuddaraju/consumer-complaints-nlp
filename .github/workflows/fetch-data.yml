name: Fetch CFPB data

on:
  workflow_dispatch:
    inputs:
      months: { description: "Months of history", default: "24" }
      per_month: { description: "Complaints sampled per month", default: "3000" }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyarrow requests
      - name: Download and sample
        run: |
          set -o pipefail
          python scripts/fetch_cfpb.py --months "${{ inputs.months || 24 }}" --per-month "${{ inputs.per_month || 3000 }}" 2>&1 | tee fetch.log
      - name: Save log for debugging
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fetch-debug
          git add -f fetch.log && git commit -m "fetch log" && git push -f origin fetch-debug
      - name: Commit sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/complaints.csv.gz data/complaints_meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh CFPB complaint sample $(date -u +%Y-%m-%d)"
          git push
